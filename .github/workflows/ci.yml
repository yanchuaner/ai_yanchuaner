name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck:ai-web

      - name: Test
        run: pnpm test:ai-web

      - name: Ops integration tests
        run: pnpm test:ops

      - name: Build
        run: pnpm build:ai-web

      - name: Contracts verify
        run: pnpm contracts:verify

      - name: Release check
        run: pnpm release:check
